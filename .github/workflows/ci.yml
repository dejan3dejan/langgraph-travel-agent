name: CI

# Run on every push to main and on every pull request.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Pull the repo onto the clean runner.
      - name: Check out code
        uses: actions/checkout@v4

      # 2. Install Python (3.12 matches the Dockerfile / production runtime).
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Install app deps plus the lint tools.
      #    Tool versions are PINNED to match .pre-commit-config.yaml exactly,
      #    so CI and the local pre-commit hooks never disagree on formatting.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black==24.1.1 ruff==0.1.14 isort==5.13.2

      # 4. Verify — same checks pre-commit runs locally (config read from pyproject.toml).
      - name: Check formatting (black)
        run: black --check .

      - name: Lint (ruff)
        run: ruff check .

      - name: Check import order (isort)
        run: isort --check-only .

      # 5. Smoke tests. Dummy API keys satisfy the import-time presence checks;
      #    the smoke suite never makes a real API call or touches the database.
      - name: Run smoke tests
        env:
          OPENAI_API_KEY: fake-ci-key
          GEMINI_API_KEY: fake-ci-key
        run: python test_smoke.py

      # 6. Unit tests. The default pytest run excludes integration tests
      #    (-m 'not integration' via pyproject), so this stays hermetic.
      - name: Run unit tests
        env:
          OPENAI_API_KEY: fake-ci-key
          GEMINI_API_KEY: fake-ci-key
        run: pytest
